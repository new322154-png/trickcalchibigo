# ═══════════════════════════════════════════════════════════════
#  game.yaml — 게임 기본 정보와 "기능 이름" 정하기
# ───────────────────────────────────────────────────────────────
#  작성법
#   - "# Q:" 로 시작하는 줄이 질문입니다.
#   - 바로 아래 칸의 TODO 를 지우고 답을 쓰면 게임에 그대로 반영됩니다.
#   - "# 예:" 는 참고용 예시입니다. 그대로 써도 되고 무시해도 됩니다.
#   - 여러 줄 글은  |  다음 줄부터 들여쓰기(스페이스 2칸 이상)해서 씁니다.
#   - 남은 TODO 개수는 터미널에서  npm run todo  로 확인할 수 있습니다.
# ═══════════════════════════════════════════════════════════════

# ── 1. 게임 정보 ────────────────────────────────────────────────

# Q: 게임 제목은 무엇인가요? (브라우저 탭, 타이틀 화면에 표시)
title: 트릭컬 더 할로윈

# Q: 부제가 있나요? 없으면 빈 따옴표 "" 로 두세요.
# 예: 폭풍우 저택의 불청객
subtitle: TODO

# Q: 제작자(팀) 이름은? 크레딧과 타이틀 화면 구석에 표시됩니다.
author: TODO

# Q: 타이틀 화면에 "화면을 눌러 시작" 같은 안내 문구를 뭐라고 할까요?
title_prompt: TODO

# Q: 패러디·팬게임 고지문을 어떻게 쓸까요? 게임 첫 실행 때와 크레딧에 뜹니다.
# 예: 본 게임은 트릭컬 리바이브의 비공식 팬게임입니다. 원작의 모든 권리는 원저작권자에게 있습니다.
disclaimer: |
  본 게임은 「트릭컬 리바이브」의 비공식 2차 창작 팬게임이며, 에피드게임즈(EPID GAMES)와 관계가 없습니다.
  원작의 캐릭터·세계관 등 모든 권리는 에피드게임즈에 있습니다.
  본 게임은 완전 무료로 배포되며, 어떠한 영리 목적도 없습니다.

# 타이틀 화면과 첫 화면(스마트폰) 아래쪽에 항상 작게 뜨는 한 줄 고지
notice: 비공식 팬게임 · 에피드게임즈와 무관 · 비영리 무료 배포

# 시놉시스 — 타이틀 화면의 "이야기" 메뉴나 첫 실행 소개에 씁니다. (대화에서 받은 초안을 넣어 두었어요)
synopsis: |
  교단에서 빵주를 타고 볼케니카로 향하던 교주 일행.
  그러나, 의문의 난기류를 만나 추락하고 만다.
  눈을 뜬 곳에는 정체 불명의 대저택이 그 고고한 자태를 뽐내고 있었다.

  방금 전까지도 누군가 살고 있던 듯 먼지 하나없이 깔끔한 저택의 내부.
  그러나 아무도 없었다.
  저택 어디에도, 생명체의 온기는 찾아볼 수 없었다.
  설상가상으로 엘레나의 무전장치마저 먹통이 된 상태.

  억센 폭우가 내리는 외딴 섬에서 노숙을 할 순 없었다.
  어쩔 수 없이 머무르는 그 저택에서 수수께끼의 사건들이 교주 일행의 앞에 펼쳐지기 시작한다!

  답을 향해 끝없이 사고하라!
  끝없이 갈구하라! 끝없이 의심하라!
  경향적 판단을 불태우고, 논리적 사고의 톱니바퀴를 회전시켜라!

# Q: 크레딧에 넣을 내용은? (한 줄에 하나씩, "- " 로 시작)
# 예:
#   - "기획·시나리오: ○○○"
#   - "UI 디자인: ○○○"
#   - "원작: 트릭컬 리바이브"
credits:
  - "원작: 트릭컬 리바이브 (© EPID GAMES)"
  - "캐릭터·원작 이미지의 권리: 에피드게임즈"
  # - "기획·시나리오·제작: ○○○"   ← 닉네임을 넣고 앞의 # 을 지우세요

# ── 2. 기능 이름 ────────────────────────────────────────────────
#  게임 안에서 버튼, 메뉴, 튜토리얼, 컷인에 쓰이는 "고유 명칭"입니다.
#  여기서 정한 이름이 게임 전체에 자동으로 들어갑니다.
#  다른 파일(대사, UI 문구, 튜토리얼)에서 %trial% 처럼 퍼센트 기호로 감싸 쓰면
#  이 값으로 자동으로 바뀝니다.  예) "%notebook%에 기록했다" → "교주 수첩에 기록했다"

names:
  # ─ 조사·추리 ─
  # Q: 대화 중 수상한 발언을 찍어 두는 "의심 표시" 버튼을 뭐라고 부를까요?
  # 예: 의심!, 수상해, 찜
  suspect_button: TODO

  # Q: 증거·단서를 모아 두는 가방(인벤토리)의 이름은?
  # 예: 증거 파일, 교주 수첩, 단서 주머니
  notebook: TODO

  # Q: 수첩 안의 탭 이름은? (증거 / 인물 / 의심 발언 / 결론)
  notebook_tab_evidence: TODO
  notebook_tab_people: TODO
  notebook_tab_suspects: TODO
  notebook_tab_conclusions: TODO

  # Q: 저택을 돌아다니며 조사하는 파트의 이름은?
  # 예: 수색, 저택 탐색, 현장 조사
  investigation: TODO

  # Q: 저택 지도 화면의 이름은?
  map: TODO

  # Q: 빈칸을 채워 가설을 세우는 "추리 보드"의 이름은?
  # 예: 추리 보드, 교주의 톱니바퀴, 사고 회로
  board: TODO

  # Q: 추리 보드에서 얻는 "결론 카드"의 이름은? (재판 여론전에서 논거로 씁니다)
  # 예: 결론, 논거, 확신
  conclusion_card: TODO

  # ─ 휴대폰 ─
  # Q: 메신저 기기(앱)의 이름은? 비워 두면 "휴대폰"
  # 예: 휴대폰, 폰, 빵주 메신저
  phone: TODO

  # Q: 여러 명이 함께 쓰는 단체 대화방의 기본 이름은?
  group_chat: TODO

  # Q: 남의 기기를 몰래 보는 기능의 이름은?
  # 예: 엿보기, 몰래 보기
  snoop: TODO

  # Q: 지워진 메시지를 되살리는 기능의 이름은?
  recover: TODO

  # ─ 재판 ─
  # Q: 재판 전체를 부르는 이름은? (단간론파의 "학급재판"에 해당)
  # 예: 저택 재판, 다과회, 교단 심판
  trial: TODO

  # Q: 재판 1페이즈 "단톡방 심리"의 이름은?
  trial_chat: TODO

  # Q: 재판 2페이즈 "역습 방어전"(교주가 몰리는 페이즈)의 이름은?
  trial_counter: TODO

  # Q: 재판 3페이즈 "최종 여론전"(설득과 투표)의 이름은?
  trial_opinion: TODO

  # Q: 체력(HP) 대신 쓰는 "발언권 게이지"의 이름은?
  voice_meter: TODO

  # Q: 단톡방 심리에서 쓰는 행동 4가지의 이름은?
  # 예: 되묻기 / 반박 / 캡처 / 대조
  action_ask: TODO        # 발언을 파고들기
  action_rebut: TODO      # 증거를 붙여 반박
  action_capture: TODO    # 사라지는 메시지 저장
  action_compare: TODO    # 두 메시지를 골라 모순 지적

  # Q: 재판 중 몰래 오는 1:1 메시지의 이름은?
  whisper: TODO

  # Q: 여론전의 투표 이름은?
  vote: TODO

  # Q: 동률일 때의 연장 토론 이름은?
  extension: TODO

  # ─ 관계·분기 ─
  # Q: 캐릭터별 "호감도"를 게임 안에서 뭐라고 표시할까요? (숫자를 보여줄지는 config.yaml 에서)
  affinity: TODO

  # Q: 교주가 받는 "의심도"의 이름은?
  suspicion: TODO

  # Q: 화면 구석의 일행 초상화 줄(인원 체크 UI)의 이름은?
  party_bar: TODO

  # Q: 분기 나무 화면 "사건 흐름도"의 이름은?
  # 예: 사건 흐름도, 운명의 갈림길, 톱니바퀴 지도
  flowchart: TODO

  # Q: 재판 직전 자동 저장 지점 "체크포인트"의 이름은?
  checkpoint: TODO

  # Q: 엔딩 모음 화면의 이름은?
  gallery: TODO

# ── 3. 컷인 외침 ────────────────────────────────────────────────
#  역전재판의 "이의 있음!"처럼 화면에 크게 뜨는 글자입니다.
#  같은 행동이라도 캐릭터마다 다르게 하고 싶으면 characters.yaml 의 cutins 에 따로 쓰세요.

cutins:
