# ═══════════════════════════════════════════════════════════════
#  text/tutorial.yaml — 기능 설명(튜토리얼)
# ───────────────────────────────────────────────────────────────
#  각 기능을 처음 쓸 때 한 번 뜨는 설명입니다. 대본에서  #tutorial:suspect  처럼
#  태그를 달면 그 자리에서 뜨고, 이미 본 설명은 다시 뜨지 않습니다.
#  수첩 → "도움말"에서 언제든 다시 볼 수 있어요.
#
#  공통 질문
#   speaker: 누가 설명하나요?  캐릭터 id(예: elena) 를 쓰면 그 캐릭터가 대사로 설명하고,
#            system 이라고 쓰면 설명 창(그림+글)으로 뜹니다.
#   title:   설명 창 제목
#   pages:   설명 내용. "- " 한 줄이 한 페이지(또는 대사 한 줄)입니다.
#            캐릭터가 설명할 때는 "(웃음)대사" 처럼 앞에 감정을 붙일 수 있어요.
#   image:   설명 그림 (public/assets/ui/tutorial/ 안의 파일 이름, 없으면 "")
# ═══════════════════════════════════════════════════════════════

