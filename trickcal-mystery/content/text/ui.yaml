  new_game: 새로 시작
  continue: 이어하기          # 가장 최근 저장에서 시작
  load: 불러오기
  settings: 설정
  gallery: "%gallery%"
  flowchart: "%flowchart%"    # 첫 파생 엔딩을 본 뒤에만 보임
  synopsis: 이야기
  credits: 크레딧
  # Q: 아직 볼 수 없는 메뉴(잠긴 흐름도 등)에 마우스를 올리면 뭐라고 뜰까요?
  locked_hint: TODO
  # Q: 2회차 이상일 때 타이틀에 뭔가 달라지나요? 달라진다면 추가 문구는? (없으면 "")
  new_game_plus_note: TODO

# ── 게임 중 메뉴 (톱니바퀴 / ESC) ──
