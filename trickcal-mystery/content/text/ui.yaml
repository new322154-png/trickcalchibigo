  # Q: 타이틀로 돌아갈 때 묻는 말은? (저장하지 않은 진행은 사라짐)
  to_title: TODO
  # Q: 새로 시작할 때 이미 진행 중인 게임이 있으면 묻는 말은?
  new_game: TODO
  # Q: 체크포인트로 돌아갈 때 묻는 말은?
  to_checkpoint: TODO
  # Q: 엿보기를 하기 직전에 묻는 말은? (들킬 수도 있다는 경고)
  snoop: TODO
  # Q: 재판에서 증거를 제시하기 직전 "정말 이걸로?" 확인 문구는? (필요 없으면 "")
