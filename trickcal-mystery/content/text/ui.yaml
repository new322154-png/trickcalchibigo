  affinity_down: "{name}의 %affinity%이(가) 내려갔다."
  suspicion_up: "교주를 향한 %suspicion%이(가) 올랐다…"
  suspicion_down: "%suspicion%이(가) 조금 누그러졌다."
  new_message: "{name}에게서 메시지가 왔다."
  checkpoint_saved: "%checkpoint% 저장"
