# ───────────────────────────────────────────────────────────────
#  - 버튼·메뉴처럼 뻔한 문구는 기본값을 채워 두었습니다. 트릭컬 말투로 바꾸고 싶으면 고치세요.
#  - 분위기가 드러나는 문구(안내, 빈 화면, 확인 창 등)는 TODO 로 비워 두었습니다.
#  - {name} 처럼 중괄호로 감싼 부분은 게임이 자동으로 채우는 자리입니다. 지우지 마세요.
#  - %notebook% 처럼 퍼센트로 감싼 부분은 game.yaml 의 기능 이름으로 바뀝니다.
# ═══════════════════════════════════════════════════════════════

