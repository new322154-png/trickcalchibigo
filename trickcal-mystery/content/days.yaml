# ═══════════════════════════════════════════════════════════════
#  days.yaml — 날마다 바뀌는 "가짜"   ★ 이 게임의 중심 규칙 ★
# ───────────────────────────────────────────────────────────────
#  저택(의 주인)은 매일 일행 중 한 명으로 변장해 섞여 든다.
#  저택은 방문객에게 "나를 찾아보라"고 한다.
#
#   · 그날 가짜를 찾아내면 → 다음 날 아침, 아무도 사라지지 않는다
#   · 못 찾으면           → 다음 날 아침, 한 명이 사라진다 (vanish_if_missed)
#   · 가짜였던 캐릭터는 그날의 기억이 없다 → 대본에서 {was_impostor("ner")} 로 확인
#
#  하루의 흐름 (대본에서):
#     아침 이야기 → 조사·대화로 어긋남 모으기 → 재판 또는 #accuse (지목) → #next_day
#   · #accuse       : 지목 화면 (한 번뿐). 맞히면 on_found, 틀리면 on_missed knot 으로
#   · 재판의 투표로 오늘의 가짜를 고르면 그것도 "찾아냄"으로 친다
#   · #next_day     : 날짜를 넘김. 못 찾았으면 이때 vanish_if_missed 가 사라지고 날짜 카드가 뜬다
#   · 대본의 조건:   {found_today()}  {impostor() == "ner"}  {found_day(2)}
#
#  대본에서 가짜의 대사에는 #mismatch:캐릭터.습관 을 달아 "평소와 다른 말"을 심어 두세요.
#  (그 습관을 알고 있는 플레이어만 의심 버튼으로 잡아낼 수 있음)
#
#  ── 이야기 줄기 지키기 ──────────────────────────────────────
#  · 줄기(누가 가짜인지, 무엇이 밝혀지는지)는 찾든 못 찾든 똑같이 흘러가게 쓰고,
#    갈리는 건 "누가 곁에 남았나"와 그날 밤 장면 몇 개뿐 → 장 끝에서 다시 한 줄기로.
#  · protect:   이야기에 꼭 필요한 사람은 그 역할을 마칠 때까지 사라지지 않게 보호
#  · critical:  꼭 맞혀야 하는 날. 못 찾으면 bad_ending 으로 → 그날 아침 체크포인트에서 다시
#               (매일 아침 자동으로 체크포인트가 저장됨)
#  · 대본 파일 위에  // @day 3  을 적어 두면, 그날까지 사라졌을 수 있는 캐릭터가
#    { present("sila"): … } 없이 말할 때 내용 검사가 경고해 줍니다.
#  · 결말은 살아남은 인원 · 모은 진실 조각으로 갈리게 (endings.yaml / 대본에서 present() 로 세기)
# ═══════════════════════════════════════════════════════════════

