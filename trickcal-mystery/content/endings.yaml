# ═══════════════════════════════════════════════════════════════
#  endings.yaml — 엔딩 목록 (갤러리)
# ───────────────────────────────────────────────────────────────
#  대본에서  #ending:ch1_wrong  태그를 만나면 엔딩 화면이 뜨고 갤러리에 기록됩니다.
#  파생 엔딩(branch)이 끝나면 "체크포인트로 돌아가기"가 뜹니다.
#
#  칸 설명
#   no:        엔딩 번호 (갤러리 정렬, "ENDING 03" 표시)
#   type:      true(트루) / normal(노멀) / branch(파생·배드)
#   title:     엔딩 제목
#   desc:      갤러리에서 해금 후 보이는 설명
#   hint:      잠겨 있을 때 보이는 힌트 (없으면 "")
#   cg:        엔딩 그림 (public/assets/cg/ 안, 없으면 "")
#   checkpoint: 파생 엔딩 후 돌아갈 체크포인트 id
#   memory:    (회차 기억) 이 엔딩을 본 적이 있으면 켜지는 flag — 대본에서 seen_ending("id") 로도 확인 가능
# ═══════════════════════════════════════════════════════════════

