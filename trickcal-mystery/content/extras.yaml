# ═══════════════════════════════════════════════════════════════
#  extras.yaml — 엑스트라 (CG 갤러리 · 음악 감상실 · 영상)
# ───────────────────────────────────────────────────────────────
#  타이틀의 "엑스트라"와 게임 중 메뉴에서 열립니다.
#  목록에 적은 순서대로 보입니다.
#
#  unlock (언제 열리나)
#    always   처음부터 열림
#    seen     게임에서 한 번 보거나 들으면 열림 (기본값)
#    엔딩 id  그 엔딩을 보면 열림 (예: ch1_true)
# ═══════════════════════════════════════════════════════════════

# ── CG ──
#  id: public/assets/cg/ 안의 파일 이름 (확장자 없이). 대본의 #cg:이름 과 같게.
cg:
  # - id: ch1_found
  #   title: 찾았다
  #   desc: 1장 · 창고에서 발견된 실라

# ── 음악 감상실 ──
#  id:     public/assets/bgm/ 안의 파일 이름 (확장자 없이). 대본의 #bgm:이름 과 같게.
#  art:    원판에 들어갈 정사각형 그림 (public/assets/ 기준, 없으면 타이틀 그림)
#  artist: 만든 사람 (예: Suno · 제작자 이름)
#  loop:   게임에서 곡을 한 번 튼 뒤 끊김 없이 반복할 구간 [시작초, 끝초]. 비우면 곡 전체를 반복
