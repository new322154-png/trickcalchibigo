# ═══════════════════════════════════════════════════════════════
#  items.yaml — 아이템 (방탈출용 물건)
# ───────────────────────────────────────────────────────────────
#  단서(evidence)와 따로, 주워서 "쓰는" 물건입니다. 열쇠, 쪽지, 도구 등.
#  얻는 법:  조사 지점의 item: / 대본 태그 #item:id / 대화의 effects: ["item:id"]
#  쓰는 법:  조사 지점의 use: (맞는 아이템을 고르면 열림)
#  확인:     대본에서 {has_item("rusty_key")}
#
#   name:   이름
#   desc:   수첩 아이템 탭에 뜨는 설명
#   image:  그림 (public/assets/items/ 안의 파일 이름, 없으면 "")
# ═══════════════════════════════════════════════════════════════

items:
  rusty_key:
    name: 녹슨 열쇠
    desc: 찻잔 받침 밑에 붙어 있던 작은 열쇠. 어딘가의 서랍에 맞을 것 같다.
    image: ""
  wet_note:
    name: 젖은 쪽지
    desc: 찻잔 바닥에 붙어 있던 쪽지. 번진 글씨로 "0417" 이라고 적혀 있다.
    image: ""
