# ═══════════════════════════════════════════════════════════════
#  evidence.yaml — 단서·증거
# ───────────────────────────────────────────────────────────────
#  대본에서  #clue:broken_cup  태그로 얻고,  has_clue("broken_cup")  으로 확인합니다.
#  재판·추리 보드에서도 이 id 로 가리킵니다.
#
#  칸 설명
#   name:     증거 이름
#   kind:     종류 — item(물건) / testimony(증언) / photo(사진) / message(메시지 캡처) / note(기록)
#   chapter:  처음 얻는 장 (수첩 정렬용)
#   image:    그림 파일 이름 (public/assets/evidence/ 안, 없으면 "")
#   desc:     얻었을 때의 설명
#   updates:  조사가 진행되며 설명이 바뀌는 경우.  flag 가 켜지면 desc 가 바뀜
#             (대본에서 #clue_update:broken_cup 태그를 달면 "내용이 바뀌었다" 알림이 뜸)
#   zoom:     확대해서 볼 수 있는 숨은 디테일 (사진 증거 등). 없으면 지우세요.
#
#  아래는 형식 예시 한 개입니다. 복사해서 늘려 가세요.
# ═══════════════════════════════════════════════════════════════

