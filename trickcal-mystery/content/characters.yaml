# ═══════════════════════════════════════════════════════════════
#  characters.yaml — 등장인물
# ───────────────────────────────────────────────────────────────
#  id(영문)는 파일 이름과 대본 태그에 쓰는 이름이라 바꾸지 마세요.
#  대본에서는 한글 이름으로 "에르핀: 대사" 처럼 쓰면 됩니다.
#
#  캐릭터 그림 파일 위치:  public/assets/characters/{id}/{감정}.gif
#    예) public/assets/characters/erpin/smile.gif
#    말하는 모션이 따로 있으면  smile_talk.gif  도 넣어 두세요 (대사 출력 중에만 재생)
#
#  ── 각 칸에 대한 공통 질문 ──
#  color:        이름표 색깔 (#RRGGBB). 캐릭터 이미지 색에 맞추면 좋아요.
#  profile:      수첩 "인물" 탭에 뜨는 소개글. 장마다 바뀌게 하려면 profile_by_chapter 에.
#  voice_note:   (작가용 메모, 게임에 안 나옴) 1인칭, 말투, 입버릇, 교주를 부르는 호칭.
#                대사를 수십만 자 쓰다 보면 말투가 흔들리니 여기 적어 두면 좋아요.
#  emotions:     이 캐릭터가 가진 감정 파일 목록. 아래 emotion_aliases 의 영문 이름 기준.
#  start_affinity: 게임 시작 시 교주 호감도 (config.yaml 의 min~max 범위)
#  bust:         (선택) 대화창 위 상반신 위치 보정 [가로, 세로] px. 예) bust: [0, 40] → 40px 아래로
#  reactions:    상황별 "기본 반응 대사". 여러 줄 쓰면 그중 하나가 무작위로 나옵니다.
#                "(분노)대사" 처럼 앞에 감정을 붙이면 그 표정으로 말해요.
#                장면마다 특별한 대사가 필요하면 대본/재판 파일에서 따로 쓰면 되고,
#                여기 있는 건 "따로 안 썼을 때" 나오는 기본값입니다.
# ═══════════════════════════════════════════════════════════════

# 감정 이름 번역표: 대본에서 한글 감정 이름을 쓰면 오른쪽 파일 이름으로 바뀝니다.
# Q: 쓰려는 감정이 더 있나요? (예: 놀람, 삐짐, 졸림, 음흉) 있으면 "한글: 영문파일명" 으로 추가하세요.
emotion_aliases:
  기본: normal
  웃음: smile
  울음: cry
  당황: panic
  분노: angry

# 대본에 캐릭터가 아닌 "화자"가 필요할 때 (예: ???, 무전기, 방송)
# Q: 캐릭터 목록에 없는 화자가 있나요? 있으면 이름과 이름표 색을 추가하세요.
extra_speakers:
  "???": { color: "#999999" }
  # 무전기: { color: "#7fd1b9" }

# ── 주인공 ──
kyoju:
  name: 교주
  player: true
  # Q: 교주의 모습이 화면에 나오나요? (true 면 다른 캐릭터처럼 그림이 뜸, false 면 이름표만)
  show_sprite: TODO
  # Q: 플레이어가 교주 이름을 직접 정하게 할까요? (true/false)
  name_input: TODO
