# ═══════════════════════════════════════════════════════════════
#  locations.yaml — 저택의 방(장소)
# ───────────────────────────────────────────────────────────────
#  여기에는 "방 자체"의 정보만 씁니다 (이름, 배경, 연결, 지도 위치, 배경 속 출구).
#  방 안에서 무엇을 조사할 수 있는지는 장마다 다르니 content/investigations/*.yaml 에 씁니다.
#
#  칸 설명
#   name:         방 이름
#   bg:           배경 그림 (public/assets/bg/ 안, 확장자 없이)
#   bg_fallback:  그 그림이 아직 없을 때 대신 쓸 배경 (캐릭터 방 → guest_rooms 등)
#   floor:        층 — 1, 2, -1(지하), attic(다락), outside(바깥). 지도에서 층별로 나뉨
#   map_pos:      지도 그림 위 위치 [가로 %, 세로 %]  (층별 지도: public/assets/ui/map_층.png)
#   doors:        이 방에서 갈 수 있는 방 (아래쪽 이동 버튼)
#   exits:        배경 그림 속 문·계단을 직접 눌러 이동 (연출 포함)
#                   { to: 방id, rect: [가로%, 세로%, 너비%, 높이%], kind: zoom|stairs_up|stairs_down|left|right|fade }
#                   → 위치는 게임 안 디버그 메뉴(F9) "조사 지점 테두리 보기"로 맞추세요
#   ambient:      분위기 입자 — dust(촛불 먼지, 기본) / rain(비) / embers(불티) / none
#   locked_until: 이 flag 가 켜져야 들어갈 수 있음,  locked_text: 잠겨 있을 때 대사
#   first_enter:  처음 들어왔을 때 대사
#   owner:        이 방 주인 캐릭터 (캐릭터 방)
# ═══════════════════════════════════════════════════════════════

# Q: (작가용) 저택의 구조 메모. 아래는 기본 구성이니 이름·연결을 마음대로 바꾸세요.
#    바깥: 해안 · 앞마당 · 뒷마당 · 헛간
#    1층:  현관 홀 · 식당 · 주방 · 응접실(재판)
#    지하: 지하 창고 · 와인 저장고 · 봉인실
#    2층:  서관 복도(교주·에르핀·죠안·네르·엘레나·아멜리아 방) · 동관 복도(다야·실라·셰이디·티그·우로스 방, 빈 객실) · 서재 · 주인의 방
#    다락: 다락방
mansion_memo: TODO

rooms:
