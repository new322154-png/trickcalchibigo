# ═══════════════════════════════════════════════════════════════
#  locations.yaml — 저택의 방(장소)
# ───────────────────────────────────────────────────────────────
#  여기에는 "방 자체"의 정보만 씁니다 (이름, 배경, 연결된 문, 지도 위치).
#  방 안에서 무엇을 조사할 수 있는지는 장마다 다르니
#  content/investigations/ch1.yaml 같은 조사 파일에 씁니다.
#
#  배경 그림:  public/assets/bg/{bg}.png  (또는 .jpg .webp)
#  지도 그림:  public/assets/ui/map.png  — map_pos 는 지도 그림 위의 위치(%)
#
#  아래 방들은 "예시"입니다. id 와 이름을 마음대로 바꾸고, 필요 없으면 지우세요.
# ═══════════════════════════════════════════════════════════════

# Q: 저택에는 어떤 방들이 있나요? 층 구조는? (작가용 메모)
# 예: 1층 — 현관 홀, 식당, 주방, 응접실 / 2층 — 객실 복도, 서재, 잠긴 방 / 바깥 — 정원, 추락한 빵주
